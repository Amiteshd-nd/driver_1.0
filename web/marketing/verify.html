  <meta name="description" content="Type a Pugmark serial number to see whether the card is real. If it lives in the ledger, it's real. If not, someone is bluffing.">

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23C8551B'%3E%3Cellipse cx='19' cy='36' rx='10' ry='12'/%3E%3Cellipse cx='39' cy='20' rx='10' ry='12'/%3E%3Cellipse cx='61' cy='20' rx='10' ry='12'/%3E%3Cellipse cx='81' cy='36' rx='10' ry='12'/%3E%3Cpath d='M38 52h24q16 0 19 16l3 10q2 16-14 16H30q-16 0-14-16l3-10q3-16 19-16z'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

  <header class="nav">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Pugmark home">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <ellipse cx="19" cy="36" rx="10" ry="12"/><ellipse cx="39" cy="20" rx="10" ry="12"/>
          <ellipse cx="61" cy="20" rx="10" ry="12"/><ellipse cx="81" cy="36" rx="10" ry="12"/>
          <path d="M38 52h24q16 0 19 16l3 10q2 16-14 16H30q-16 0-14-16l3-10q3-16 19-16z"/>

      <nav aria-label="Primary">
        <ul class="nav-links">
          <li><a href="index.html#how">How it works</a></li>
          <li><a href="index.html#animals">Animals</a></li>
          <li><a href="verify.html" aria-current="page">Verify a card</a></li>
          <li><a href="index.html#privacy">Privacy</a></li>
        </ul>
      </nav>
      <div class="nav-cta">
        <a class="btn btn--primary" href="#" data-store="ios">App Store</a>
        <a class="btn" href="#" data-store="android">Google Play</a>
      </div>
    </div>
  </header>

  <main id="main" class="verify-main">
    <div class="wrap">
      <p class="eyebrow">Verify a card</p>
      <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Is this card real?</h1>
      <form class="lookup" action="verify.html" method="get" id="lookup-form" style="max-width:560px;margin-bottom:40px">
        <label for="q">Serial number</label>
        <input id="q" name="q" type="text" autocomplete="off" spellcheck="false" placeholder="Tiger #0427" required aria-describedby="lookup-help">
        <button class="btn btn--primary" type="submit">Verify</button>
        <p id="lookup-help" class="muted" style="flex:1 1 100%;font-size:13px;margin:4px 0 0">Also accepts “tiger 427” or “TGR-0427”. Only serials are searchable — never people.</p>
      </form>

      <div id="result" class="verify-layout" aria-live="polite" aria-busy="false">
        <!-- rendered by verify.js -->
        <noscript><div class="state"><h2>JavaScript needed</h2><p>This page asks the Pugmark ledger from your browser. Turn JavaScript on, or open the card's share link instead.</p></div></noscript>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span class="tag">Leave your pugmark.</span>
      <span>© 2026 Pugmark</span>
      <nav aria-label="Legal">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </nav>
    </div>
  </footer>

  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script src="verify-config.js"></script>
  <script src="verify.js" defer></script>
